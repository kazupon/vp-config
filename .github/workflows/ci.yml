---
name: CI

env:
  CI: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    name: Lint (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check strictly codes
        run: vp check

      - name: Check source compatibility
        run: vp run typecheck:compat

      - name: Check dependencies
        run: vp run knip

  test:
    needs:
      - build
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Testing
        run: vp test

  build:
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}, vite-plus ${{ matrix.vite-plus-version }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        vite-plus-version: ['0.1.24', '0.2.1']
    steps:
      - name: Checkout codes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: 22
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Building
        run: vp pack

      - name: Check packaged compatibility
        run: vp run typecheck:compat:packaged
        env:
          VITE_PLUS_VERSION: ${{ matrix.vite-plus-version }}
