allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
minimumReleaseAgeExclude:
  - '@kazupon/vp-config'
  - '@iconify-json/simple-icons'
  - '@ox-jsdoc/**'
  - ox-jsdoc
  - '@ox-content/**'
  - vitepress-api-references
overrides:
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
